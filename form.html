    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #7b2cbf 0%, #f77f00 100%);
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --white: #ffffff;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex; flex-direction: column;
            color: var(--text-dark);
        }
        
        /* --- СТИЛИ ДЛЯ ЛОГОТИПА --- */
        .header-logo {
            padding: 24px 40px;
            display: flex;
            align-items: flex-start;
        }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo-badge {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px 10px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .logo-badge:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .logo-svg { height: 44px; width: auto; display: block; }
        /* ---------------------------------- */

        .main-content {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .form-wrapper {
            background: var(--white); padding: 40px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            width: 100%; max-width: 480px; position: relative;
        }
        /* СТИЛИ ДЛЯ КНОПКИ НАЗАД */
        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            background: #f3f4f6; border: none; color: var(--text-gray);
            font-size: 14px; font-weight: 600; padding: 8px 16px;
            border-radius: 20px; cursor: pointer; margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background: #e5e7eb; color: var(--text-dark); transform: translateX(-2px);
        }

        .form-wrapper h2 { 
            text-align: center; margin-top: 0; margin-bottom: 10px; 
            font-size: 28px; color: var(--text-dark);
        }
        .form-subtitle {
            text-align: center; color: var(--text-gray); font-size: 15px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; margin-bottom: 8px; font-weight: 600; 
            font-size: 14px; color: var(--text-dark); 
        }
        .form-control {
            width: 100%; padding: 14px 16px; border: 1px solid #e5e7eb;
            border-radius: 12px; font-size: 16px; background: #f9fafb;
            transition: all 0.3s ease; box-sizing: border-box;
            font-family: inherit; color: var(--text-dark);
        }
        .form-control:focus {
            outline: none; border-color: #7b2cbf; background: white;
            box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.1);
        }
        textarea.form-control {
            resize: vertical; min-height: 100px; line-height: 1.5;
        }
        select.form-control { 
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; background-position: right 1rem center; 
            background-size: 1em; cursor: pointer;
        }
        
        /* Чекбокс согласия */
        .checkbox-group {
            display: flex; align-items: flex-start; gap: 10px;
            margin: 20px 0; font-size: 13px; color: var(--text-gray);
        }
        .checkbox-group input[type="checkbox"] {
            margin-top: 2px; flex-shrink: 0;
        }
        .checkbox-group a {
            color: #7b2cbf; text-decoration: none;
        }
        .checkbox-group a:hover { text-decoration: underline; }
        
        .btn-submit {
            width: 100%; background: var(--primary-gradient); color: white;
            border: none; padding: 16px; border-radius: 12px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            margin-top: 10px; transition: opacity 0.3s, transform 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* Сообщение об успехе */
        .success-message {
            display: none; text-align: center; padding: 40px 20px;
        }
        .success-message svg {
            width: 64px; height: 64px; color: #10b981; margin-bottom: 16px;
        }
        .success-message h3 {
            font-size: 24px; margin-bottom: 12px; color: var(--text-dark);
        }
        .success-message p {
            color: var(--text-gray); margin-bottom: 24px;
        }
        
        @media (max-width: 480px) {
            .header-logo { padding: 20px; }
            .logo-svg { height: 36px; }
            .logo-badge { padding: 8px 14px 8px 8px; }
            .form-wrapper { padding: 25px; border-radius: 20px; }
            .form-wrapper h2 { font-size: 24px; }
        }
    </style>
</head>

    <!-- ЛОГОТИП -->

    <div class="main-content">
        <div class="form-wrapper">
            <!-- КНОПКА НАЗАД -->
            <button type="button" class="btn-back" onclick="window.history.back()">← Назад</button>
            
            <h2>Обсудим ваш проект?</h2>
            <p class="form-subtitle">Заполните форму, и мы свяжемся с вами в течение 15 минут в рабочее время</p>
            
            <!-- ФОРМА FORMSPREE -->
            <form id="contactForm" action="https://formspree.io/f/mqpanbwn" method="POST">
                <!-- Скрытые поля для Formspree -->
                <input type="hidden" name="_next" value="https://forpostsmm.ru/form.html?success=1">

                <div class="form-group">

                <div class="form-group">
                    <label for="phone">Номер телефона</label>

                        <option value="Таргетированная реклама">Таргетированная реклама</option>
                        <option value="Работа с блогерами">Работа с блогерами</option>
                        <option value="Комьюнити-менеджмент">Комьюнити-менеджмент</option>
                        <option value="Аналитика и отчётность">Аналитика и отчётность</option>

                    </select>

                <div class="form-group">
                    <label for="message">Комментарий</label>

                </div>

                <!-- Чекбокс согласия -->

                    <input type="checkbox" id="privacy" name="privacy" required checked>
                    <label for="privacy">Я согласен с <a href="privacy.html" target="_blank">политикой конфиденциальности</a> и обработкой персональных данных *</label>

    <script>
        // Автозаполнение тарифа из URL параметра
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const planName = urlParams.get('plan');
            const successParam = urlParams.get('success');
            
            // Показываем сообщение об успехе если есть параметр success
            if (successParam === '1') {
                document.querySelector('form').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                document.querySelector('.form-subtitle').style.display = 'none';
            }

            // Автозаполнение тарифа
            if (planName) {
                const tariffSelect = document.getElementById('tariff');
                
                // Ищем совпадение по ключевым словам
                const planLower = planName.toLowerCase();
                for (let i = 0; i < tariffSelect.options.length; i++) {
                    const optionText = tariffSelect.options[i].text.toLowerCase();
                    const optionValue = tariffSelect.options[i].value.toLowerCase();
                    
                    if (optionText.includes(planLower) || optionValue.includes(planLower) ||
                        planLower.includes('light') && optionText.includes('light') ||
                        planLower.includes('medium') && optionText.includes('medium') ||
                        planLower.includes('strong') && optionText.includes('strong')) {
                        tariffSelect.selectedIndex = i;
                        break;
                    }
                }
            }

            /* =========================================================
               НОВАЯ ФУНКЦИЯ: МАСКА ВВОДА НОМЕРА ТЕЛЕФОНА
               Автоматически добавляет скобки и дефисы при вводе
               ========================================================= */
            const phoneInput = document.getElementById('phone');
            if (phoneInput) {
                phoneInput.addEventListener('input', function(e) {
                    // Оставляем только цифры
                    let val = this.value.replace(/\D/g, '');
                    let formattedValue = '';
                    
                    if (!val) {
                        this.value = '';
                        return;
                    }
                    
                    // Если начали с 9, подставляем 7. Если с 8, оставляем 8 (или меняем на 7)
                    if (['7', '8', '9'].indexOf(val[0]) > -1) {
                        if (val[0] === '9') val = '7' + val;
                        const firstSymbols = (val[0] === '8') ? '8' : '7';
                        formattedValue = '+' + firstSymbols + ' ';
                        if (val.length > 1) {
                            formattedValue += '(' + val.substring(1, 4);
                        }
                        if (val.length >= 5) {
                            formattedValue += ') ' + val.substring(4, 7);
                        }
                        if (val.length >= 8) {
                            formattedValue += '-' + val.substring(7, 9);
                        }
                        if (val.length >= 10) {
                            formattedValue += '-' + val.substring(9, 11);
                        }
                    } else {
                        formattedValue = '+' + val.substring(0, 16);
                    }
                    
                    this.value = formattedValue;
                });

                // Корректная работа клавиши Backspace для полной очистки маски
                phoneInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length <= 4) {
                        this.value = '';
                    }
                });
            }
            /* ========================================================= */
        });
        
        // Обработка отправки формы
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Отправка...';
            submitBtn.disabled = true;
            ym(113769508, 'reachGoal', 'form_submit');
        });
    </script>
