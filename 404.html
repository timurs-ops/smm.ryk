<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | Форпост</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #6a0dad 0%, #9b30a0 25%, #c45a8a 45%, #d4845a 65%, #e8a830 85%, #f0c020 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .content { color: #fff; max-width: 500px; }
        h1 { font-size: 120px; font-weight: 900; line-height: 1; opacity: 0.9; }
        h2 { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
        p { font-size: 16px; opacity: 0.8; margin-bottom: 32px; }
        .btn { display: inline-block; background: #fff; color: #1a1a2e; padding: 16px 36px; border-radius: 32px; font-size: 16px; font-weight: 700; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <h2>Страница не найдена</h2>
        <p>Возможно, она была удалена или вы ввели неверный адрес.</p>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
